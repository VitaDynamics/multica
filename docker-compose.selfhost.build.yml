# Development override: build the backend/web/postgres images from the current
# checkout instead of pulling the official GHCR images.

services:
  postgres:
    image: ${MULTICA_POSTGRES_IMAGE:-multica-postgres}:${MULTICA_POSTGRES_TAG:-pg17-cron}
    build:
      context: .
      dockerfile: Dockerfile.postgres

  backend:
    image: ${MULTICA_BACKEND_IMAGE:-multica-backend}:${MULTICA_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${MULTICA_IMAGE_TAG:-dev}
        COMMIT: ${MULTICA_COMMIT_SHA:-}

  frontend:
    image: ${MULTICA_WEB_IMAGE:-multica-web}:${MULTICA_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_APP_VERSION: ${MULTICA_IMAGE_TAG:-dev}
