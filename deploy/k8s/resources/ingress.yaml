# TLS entry for local hosts testing. Business replicas remain zero until final cutover.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multica
  namespace: multica
  annotations:
    # A non-matching controller excludes this Ingress from external-dns v0.21.0.
    # Keep public DNS unchanged until a separate DNS cutover is authorized.
    external-dns.alpha.kubernetes.io/controller: hosts-only
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - multica.vita.cn
      secretName: multica-vita-cn-tls
  rules:
    - host: multica.vita.cn
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: multica-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: multica-frontend
                port:
                  number: 3000
