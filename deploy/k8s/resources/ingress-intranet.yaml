# Private entry for both domains; publish DNS only for the new hostname.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multica-intranet
  namespace: multica
  annotations:
    # Publish only the explicitly annotated new hostname; preserve legacy DNS.
    external-dns.alpha.kubernetes.io/controller: dns-controller
    external-dns.alpha.kubernetes.io/ingress-hostname-source: annotation-only
    external-dns.alpha.kubernetes.io/hostname: multica-cloud.vita.cn
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: alb-intranet
  tls:
    - hosts:
        - multica.vita.cn
      secretName: multica-vita-cn-tls
    - hosts:
        - multica-cloud.vita.cn
      secretName: multica-cloud-vita-cn-tls
  rules:
    - host: multica.vita.cn
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: multica-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: multica-frontend
                port:
                  number: 3000
    - host: multica-cloud.vita.cn
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: multica-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: multica-frontend
                port:
                  number: 3000
